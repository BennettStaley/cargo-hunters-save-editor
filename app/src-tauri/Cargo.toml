[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# arbitrary_precision/preserve_order are enabled on serde_json by ch_engine and
# unified across the build graph, so the Value type matches the engine's.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
# The pure-Rust save engine (no Tauri dep); see ../engine.
ch_engine = { path = "../engine" }

